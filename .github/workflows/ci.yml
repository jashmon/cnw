# Build the site and run the QA suite (lint, types, user flows, links, widths, axe) on every push and PR.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start the production server
        run: |
          npx next start -p 3200 &
          npx --yes wait-on@8.0.1 http://localhost:3200 --timeout 60000
      - run: npm run qa
